<div class="checklist-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit($event)">
    <div class="header-row">
      <div></div>
      <div class="col-v">V</div>
      <div class="col-f">F</div>
    </div>

    <div class="item-row" *ngFor="let item of items">
      <label>{{ item.label }}</label>

      <input
        type="checkbox"
        [checked]="isChecked(item.key, true)"
        (change)="onToggle(item.key, true)"
      />

      <input
        type="checkbox"
        [checked]="isChecked(item.key, false)"
        (change)="onToggle(item.key, false)"
      />

      <small class="erro" *ngIf="submitted && form.get(item.key)?.value === null">
        obrigatório
      </small>
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'ENVIANDO...' : 'ENVIAR' }}
    </button>
  </form>
</div>
